<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROYAL DICE 3D CASINO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🎰 ক্যাসিনো হেডার প্যানেল -->
    <div class="header">
        <div class="brand">
            <div class="name">ROYAL DICE 3D</div>
            <div class="game">SIC BO SHAKE MASTER</div>
        </div>
        <div class="header-right">
            <button class="sound-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
            <div class="balance-box">৳ <span id="user-balance">0.00</span></div>
        </div>
    </div>

    <!-- 🎲 [৩ডি ছক্কার জাদুকরী ক্যানভাস কাঁচের বাটি জোন] -->
    <div class="dice-cup-zone">
        <canvas id="dice-board" width="360" height="280"></canvas>
    </div>

    <!-- 🏆 ইন-লাইন লাইভ বাজি ধরার প্রধান ৩টি ঘর প্যানেল ভাই ভাই -->
    <div class="betting-board">
        <button class="bet-board-btn even-bet" id="board-even" onclick="selectBetSide('SMALL_EVEN')">
            <span class="board-label">EVEN (জোড়) 🔴</span>
            <span class="board-odds">x2.00</span>
        </button>
        
        <button class="bet-board-btn triple-bet" id="board-triple" onclick="selectBetSide('ANY_TRIPLE')">
            <span class="board-label">TRIPLE 👑</span>
            <span class="board-odds">x30.00</span>
        </button>
        
        <button class="bet-board-btn odd-bet" id="board-odd" onclick="selectBetSide('BIG_ODD')">
            <span class="board-label">ODD (বিজোড়) 🔵</span>
            <span class="board-odds">x2.00</span>
        </button>
    </div>

    <!-- 🏆 ইন-লাইন লাইভ স্কোরিং মেসেজ বার -->
    <div class="win-status-container" id="win-status-box">
        <span id="win-text-msg">আপনার অপশন চুজ করে SHAKE বোতাম চাপুন ভাই!</span>
    </div>

    <!-- 🎛️ কন্ট্রোল প্যানেল এরিয়া (৳১-৳২০০০ প্লাস-মাইনাস ও SHAKE বোতাম পাশাপাশি লক ভাই) -->
    <div class="footer-controls">
        <div class="play-section">
            <div class="bet-selector">
                <button class="bet-btn-nav" onclick="adjustBet('minus')">−</button>
                <div style="text-align: center; width: 60px;">
                    <div style="font-size: 9px; color: #aaa; font-weight: bold;">BET</div>
                    <div style="font-size: 15px; font-weight: 900; color: #fff;" id="bet-display">৳৫০</div>
                </div>
                <button class="bet-btn-nav" onclick="adjustBet('plus')">+</button>
            </div>

            <button class="play-btn" id="spin-btn" onclick="handleDiceShake()">SHAKE</button>

            <div class="icon-group">
                <button class="icon-btn" id="auto-btn" onclick="toggleAuto()">🔄</button>
            </div>
        </div>
    </div>

    <!-- 🔌 [উইনগো কালার ট্রেড সিঙ্ক - ইউনিভার্সাল সকেট ইঞ্জিন লাইব্রেরি ভাই] -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('username') || "guest_user";
        const urlWallet = urlParams.get('wallet') || "main";
        
        const SERVER_URL = window.location.origin;

        const canvas = document.getElementById("dice-board");
        const ctx = canvas.getContext("2d");

        let balance = 0.00;
        let currentBet = 50; 
        let selectedOption = null; // SMALL_EVEN, BIG_ODD, ANY_TRIPLE
        let isSpinning = false; 
        let isAuto = false;
        let isMuted = false;
        let autoInterval = null;

        // ৩টি ৩ডি ছক্কার পজিশন মেমরি ভাই
        let diceList = [
            { x: 120, y: 140, val: 1, angle: 0 },
            { x: 180, y: 120, val: 3, angle: 0 },
            { x: 240, y: 150, val: 5, angle: 0 }
        ];

        // ক্যানভাসে ডাইসের ৬টি পিঠের ওরিজিনাল ডট জেনারেটর ভাই ভাই
        function drawDiceFace(x, y, size, val, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            
            // ছক্কার মূল লাল ক্যাসিনো বডি রেন্ডার ভাই
            ctx.fillStyle = "#ea2027";
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(-size/2, -size/2, size, size, 8);
            ctx.fill();
            ctx.stroke();

            // চকচকে সাদা ডট এলাইনমেন্ট ম্যাথ ভাই ভাই
            ctx.fillStyle = "#ffffff";
            const r = size * 0.08;
            const pos = size * 0.23;

            const dots = {
                1: [[0, 0]],
                2: [[-pos, -pos], [pos, pos]],
                3: [[-pos, -pos], [0, 0], [pos, pos]],
                4: [[-pos, -pos], [-pos, pos], [pos, -pos], [pos, pos]],
                5: [[-pos, -pos], [-pos, pos], [0, 0], [pos, -pos], [pos, pos]],
                6: [[-pos, -pos], [-pos, 0], [-pos, pos], [pos, -pos], [pos, 0], [pos, pos]]
            };

            if (dots[val]) {
                dots[val].forEach(d => {
                    ctx.beginPath();
                    ctx.arc(d[0], d[1], r, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
            ctx.restore();
        }

        function renderDiceBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // কাঁচের জাদুকরী বাটির বৃত্তাকার মেটালিক রিম ভাই ভাই
            ctx.strokeStyle = "rgba(255, 215, 0, 0.4)";
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height/2, 120, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.fillStyle = "rgba(14, 19, 34, 0.6)";
            ctx.fill();

            // ৩টি ছক্কা লাইভ প্রিন্টিং লুপ ভাই ভাই
            diceList.forEach(d => {
                drawDiceFace(d.x, d.y, 42, d.val, d.angle);
            });
        }

        if (typeof io !== 'undefined') {
            const socket = io();
            socket.on("balanceUpdate", (data) => {
                if (data && data.username === urlUserId) {
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    fetchLiveBalance();
                }
            });
        }

        async function fetchLiveBalance() {
            try {
                const response = await fetch(`${SERVER_URL}/api/dice3d-balance?userId=${urlUserId}&wallet=${urlWallet}`);
                const data = await response.json();
                if (data && data.success) {
                    balance = parseFloat(data.balance);
                    document.getElementById("user-balance").innerText = balance.toFixed(2);
                }
            } catch (e) { console.error("Balance lag"); }
        }

        window.onload = () => {
            if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
            fetchLiveBalance();
            renderDiceBoard();
        };

        function selectBetSide(side) {
            if (isSpinning) return;
            selectedOption = side;
            
            document.querySelectorAll(".bet-board-btn").forEach(b => b.classList.remove("active-side-bet"));
            if (side === 'SMALL_EVEN') document.getElementById("board-even").classList.add("active-side-bet");
            if (side === 'ANY_TRIPLE') document.getElementById("board-triple").classList.add("active-side-bet");
            if (side === 'BIG_ODD') document.getElementById("board-odd").classList.add("active-side-bet");
            
            playAudio('click');
        }

        function adjustBet(action) {
            if (isSpinning) return;
            if (action === 'minus' && currentBet > 1) {
                if (currentBet <= 10) currentBet -= 1;
                else if (currentBet <= 100) currentBet -= 10;
                else currentBet -= 50;
            }
            if (action === 'plus' && currentBet < 2000) {
                if (currentBet < 10) currentBet += 1;
                else if (currentBet < 100) currentBet += 10;
                else currentBet += 50;
            }
            if (currentBet < 1) currentBet = 1;
            if (currentBet > 2000) currentBet = 2000;
            
            document.getElementById("bet-display").innerText = `৳${currentBet}`;
            playAudio('click');
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById("mute-btn").innerText = isMuted ? "🔇" : "🔊";
            document.getElementById("mute-btn").classList.toggle("muted-active", isMuted);
        }

                function toggleAuto() {
            isAuto = !isAuto;
            document.getElementById("auto-btn").classList.toggle("active", isAuto);
            if (isAuto && !isSpinning) handleDiceShake();
            playAudio('click');
        }

        async function handleDiceShake() {
            if (isSpinning) return;
            if (!selectedOption) {
                alert("🚨 আগে বাজি ধরার যেকোনো ১টি ঘর (EVEN, ODD বা TRIPLE) সিলেক্ট করুন ভাই!");
                isAuto = false;
                document.getElementById("auto-btn").classList.remove("active");
                return;
            }

            const msgBox = document.getElementById("win-status-box");
            msgBox.className = "win-status-container";
            document.getElementById("win-text-msg").innerText = "🎲 ছক্কা পাত্রের ভেতর কাঁপছে...";

            isSpinning = true;
            document.getElementById("spin-btn").disabled = true;

            // 🚀 ছক্কা নাড়ানোর সাথে সাথে spin2.mp3 কড়কড় মেটালিক সাউন্ড ফায়ার লক ভাই ভাই
            playAudio('spin');

            let shakeFrameCount = 0;
            const shakeInterval = setInterval(() => {
                diceList.forEach(d => {
                    // কাঁচের বাটির ভেতর ছক্কাগুলোর ডাইনামিক র্যান্ডম কোঅর্ডিনেট মুভমেন্ট ভাই ভাই
                    d.x = 120 + Math.floor(Math.random() * 120);
                    d.y = 100 + Math.floor(Math.random() * 80);
                    d.angle = Math.random() * Math.PI * 2;
                    d.val = Math.floor(Math.random() * 6) + 1; // ফ্ল্যাশ র্যান্ডমাইজেশন
                });
                renderDiceBoard();
                shakeFrameCount++;
            }, 50);

            try {
                const response = await fetch(`${SERVER_URL}/api/dice3d-shake`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: urlUserId,
                        amount: parseFloat(currentBet),
                        wallet: urlWallet,
                        prediction: selectedOption
                    })
                });

                const data = await response.json();

                if (data && data.success === true) {
                    balance = parseFloat(data.balance);
                    if (window.parent) window.parent.postMessage({ action: "refresh_wallet" }, "*");
                    if (window.top) window.top.postMessage({ action: "refresh_wallet" }, "*");

                    // ২ সেকেন্ডের থ্রিল ভাইব্রেশন শেষ হওয়ার পর ওরিজিনাল সার্ভার ডাইস রেজাল্ট শো হবে ভাই ভাই
                    setTimeout(() => {
                        clearInterval(shakeInterval);
                        
                        // ব্যাকঅ্যান্ড থেকে আসা ৩টি ছক্কার ১ শতভাগ নিখুঁত রিয়ালিস্টিক পজিশন এলাইন ভাই
                        diceList = [
                            { x: 130, y: 140, val: data.dice1, angle: 0.2 },
                            { x: 180, y: 125, val: data.dice2, angle: -0.4 },
                            { x: 230, y: 145, val: data.dice3, angle: 0.5 }
                        ];
                        renderDiceBoard();

                        showFinalResult(data.status, data.winAmount, data.sum, data.resultName);
                    }, 2000);

                } else {
                    clearInterval(shakeInterval);
                    alert(data.message || "❌ Insufficient Balance! Please Recharge.");
                    stopDiceState();
                }
            } catch (err) {
                clearInterval(shakeInterval);
                alert("⚠️ সেশন আউট! আবার SHAKE বোতাম চাপুন ভাই ভাই।");
                stopDiceState();
            }
        }

                function showFinalResult(status, winAmount, winDice1, winDice2, winDice3, winSum, winnerType) {
            const msgBox = document.getElementById("win-status-box");
            const textMsg = document.getElementById("win-text-msg");

            // 🚀 [ভ্যারিয়েবল বাগ ফিক্সড]: সার্ভার ডাটা অনুযায়ী জোড়/বিজোড় নাম নিখুঁত কনভার্ট লক ভাই ভাই!
            const typeNameBengali = (winnerType === "EVEN") ? "জোড়" : (winnerType === "TRIPLE") ? "ট্রিপল 👑" : "বিজোড়";

            if (status === "win") {
                playAudio('win');
                msgBox.className = "win-status-container win-glow-bar";
                textMsg.innerText = `🏆 মেগা উইন!! যোগফল: ${winSum} (${typeNameBengali}) [৳${winAmount}]`;
            } else {
                msgBox.className = "win-status-container lose-glow-bar";
                textMsg.innerText = `❌ যোগফল: ${winSum} (${typeNameBengali})। এই রাউন্ডে ভাগ্য সহায় হয়নি ভাই!`;
            }

            document.getElementById("user-balance").innerText = balance.toFixed(2);
            stopDiceState();

            if (isAuto) {
                autoInterval = setTimeout(() => {
                    if (isAuto) handleRoyalDiceShake();
                }, 2500);
            }
        }

        function stopDiceState() {
            isSpinning = false;
            document.getElementById("spin-btn").disabled = false;
            if (!isAuto && autoInterval) clearTimeout(autoInterval);
        }

        // 🎯 [৩টি ওরিজিনাল প্রিমিয়াম ক্যাসিনো সাউন্ড ও বাফার গেটওয়ে লক ভাই ভাই]
        const slotSounds = {
            click: new Audio('click2.mp3'),
            spin: new Audio('spin2.mp3'),
            win: new Audio('win2.mp3')
        };
        Object.values(slotSounds).forEach(s => s.load());

        function playAudio(type) { 
            if (isMuted) return; 
            try { 
                slotSounds[type].currentTime = 0; 
                slotSounds[type].play(); 
            } catch(e){} 
        }
    </script>
</body>
</html>
